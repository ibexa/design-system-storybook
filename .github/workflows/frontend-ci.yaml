name: Frontend build

on:
    push:
        paths:
            - "**.js"
            - "**.ts"
        branches:
            - main
            - '[0-9]+.[0-9]+'
    pull_request:
        paths:
            - "**.js"
            - "**.ts"

jobs:
    frontend-test:
        name: Frontend build test
        runs-on: "ubuntu-26.04"
        timeout-minutes: 5

        steps:
            -   uses: actions/checkout@v7
            -   uses: actions/setup-node@v7
                with:
                    node-version: '20'
            -   run: yarn install
            -   run: yarn ibexa-generate-tsconfig --use-relative-paths
            -   run: yarn test
